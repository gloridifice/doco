name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag):
              raise SystemExit(f"Invalid release tag: {tag}; expected vX.Y.Z")
          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag} does not match Cargo.toml version {version}")
          print(f"Releasing doco {version}")
          PY

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      RELEASE_TAG: ${{ github.ref_name }}
      ASSET_NAME: doco-${{ github.ref_name }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --target "$TARGET" -- -D warnings
      - run: cargo test --locked --all-targets --target "$TARGET"
      - run: cargo build --locked --release --bin doco --target "$TARGET"
      - name: Check binary version
        run: |
          binary="target/$TARGET/release/doco"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            binary="${binary}.exe"
          fi
          test "$("$binary" --version)" = "doco ${RELEASE_TAG#v}"
      - name: Package Unix binary
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -czf "dist/$ASSET_NAME.tar.gz" \
            -C "target/$TARGET/release" doco \
            -C "$GITHUB_WORKSPACE" README.md
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Compress-Archive -Path "target/$env:TARGET/release/doco.exe", README.md `
            -DestinationPath "dist/$env:ASSET_NAME.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: doco-${{ github.ref_name }}-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes
